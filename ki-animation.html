<!DOCTYPE html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI-Automationen Hero</title>
<style>
  html,body { margin:0; height:100%; background:transparent; }
  body { display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .wrap { width:min(760px, 96vmin); padding:16px; box-sizing:border-box; }
  .wrap svg { width:100%; height:auto; display:block; }

  .float { animation: floatY 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .glow  { animation: glowP 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .flow  { animation: dash 2.6s linear infinite; }
  .ring  { animation: pulse 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes floatY { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes glowP  { 0%,100% { opacity:.5 } 50% { opacity:1 } }
  @keyframes dash   { to { stroke-dashoffset:-100 } }
  @keyframes pulse  { 0% { opacity:.5; transform:scale(.86) } 70% { opacity:0; transform:scale(1.16) } 100% { opacity:0; transform:scale(1.16) } }
  .lbl { font-weight:600; font-size:13.5px; fill:#23406E; }
</style>
</head>
<body>

<div class="wrap">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 760" width="560" height="760" role="img" aria-label="Smartphone mit eingehendem Anruf, umgeben von KI-Automationen: Anruf angenommen, WhatsApp beantwortet, Angebot vorbereitet, Bewertung angefragt, Rechnung vorbereitet">
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#4C8DF6" stop-opacity=".42"></stop>
      <stop offset="55%" stop-color="#2F6BE4" stop-opacity=".10"></stop>
      <stop offset="100%" stop-color="#2F6BE4" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"></stop>
      <stop offset="100%" stop-color="#E9F1FC"></stop>
    </linearGradient>
    <filter id="shPhone" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06122E" flood-opacity=".38"></feDropShadow>
    </filter>
    <filter id="shChip" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#06122E" flood-opacity=".30"></feDropShadow>
    </filter>
    
  </defs>

  
  <circle class="glow" cx="280" cy="372" r="220" fill="url(#glow)"></circle>

  
  <g class="flow" stroke="#6F9BF0" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-dasharray="0.5 9" opacity=".85">
    <path d="M218,262 C160,236 104,172 70,132"></path>
    <path d="M346,256 C372,212 360,158 352,130"></path>
    <path d="M206,378 C158,380 106,386 70,389"></path>
    <path d="M356,378 C404,380 352,386 352,389"></path>
    <path d="M280,532 C252,565 228,604 210,626"></path>
  </g>
  <g fill="#7FA8F2">
    <circle cx="218" cy="262" r="3.4"></circle>
    <circle cx="346" cy="256" r="3.4"></circle>
    <circle cx="206" cy="378" r="3.4"></circle>
    <circle cx="356" cy="378" r="3.4"></circle>
    <circle cx="280" cy="532" r="3.4"></circle>
  </g>

  
  <circle class="ring" cx="280" cy="318" r="60" fill="none" stroke="#5C97F7" stroke-width="2"></circle>
  <circle class="ring" cx="280" cy="318" r="60" fill="none" stroke="#5C97F7" stroke-width="2" style="animation-delay:1.5s"></circle>

  
  <g filter="url(#shPhone)">
    <rect x="204" y="220" width="152" height="308" rx="32" fill="url(#phoneBody)"></rect>

  <rect x="212" y="228" width="136" height="292" rx="24" fill="#EEF4FE"></rect>
  <rect x="262" y="233" width="36" height="7" rx="3.5" fill="#26395E"></rect>

  <text x="280" y="272" text-anchor="middle" class="scrlbl" font-size="9.5" font-weight="700" letter-spacing="1.3" fill="#8AA0C7">EINGEHENDER ANRUF</text>

  
  <circle cx="280" cy="312" r="25" fill="#DCE9FC"></circle>
  <circle cx="280" cy="305" r="8" fill="#2F6BE4"></circle>
  <path d="M263,329 a17,17 0 0 1 34,0 z" fill="#2F6BE4"></path>

  
  <rect x="244" y="348" width="72" height="9" rx="4.5" fill="#C3D5F1"></rect>

  <rect x="240" y="384" width="80" height="23" rx="11.5" fill="#2F6BE4"></rect>

  <text x="267" y="399.2" class="scrlbl" font-size="10" font-weight="700" fill="#FFFFFF">KI aktiv</text>

  
  <g fill="#A7C3F5">
    <rect x="234" y="430" width="4" height="10" rx="2"></rect>
    <rect x="242" y="424" width="4" height="22" rx="2"></rect>
    <rect x="250" y="428" width="4" height="14" rx="2"></rect>
    <rect x="258" y="420" width="4" height="30" rx="2"></rect>
    <rect x="266" y="426" width="4" height="18" rx="2"></rect>
    <rect x="274" y="422" width="4" height="26" rx="2"></rect>
    <rect x="282" y="430" width="4" height="10" rx="2"></rect>
    <rect x="290" y="426" width="4" height="18" rx="2"></rect>
    <rect x="298" y="430" width="4" height="10" rx="2"></rect>
    <rect x="306" y="424" width="4" height="20" rx="2"></rect>
  </g>

  
  <circle cx="259" cy="484" r="18" fill="#2F6BE4"></circle>
  <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="#FFFFFF" transform="translate(250,475) scale(.75)"></path>
  <circle cx="301" cy="484" r="18" fill="#E6ECF5"></circle>
  <g transform="translate(301,484) rotate(135)">
    <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" fill="#93A2BA" transform="translate(-9,-9) scale(.75)"></path>

    <circle cx="60" cy="118" r="15" fill="#EAF2FF"></circle>

    <circle cx="52" cy="386" r="15" fill="#EAF2FF"></circle>

    <circle cx="354" cy="386" r="15" fill="#EAF2FF"></circle>

    <g filter="url(#shChip)"><rect x="176" y="614" width="208" height="52" rx="16" fill="#FFFFFF"></rect></g>
    <circle cx="206" cy="640" r="15" fill="#EAF2FF"></circle>
    <g transform="translate(206,640)" stroke="#2F6BE4" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">

</div>

</body></html>
